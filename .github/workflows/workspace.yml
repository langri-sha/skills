name: Workspace

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    permissions:
      contents: write
      id-token: write
    uses: langri-sha/github/.github/workflows/check.yml@v0.33.0
    with:
      dagger: true
      dagger-version: v1.0.0-beta.21
      prettier: true
      projen: true
      typescript: true
    secrets: inherit

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: langri-sha/github/actions/pnpm@v0.31.0

      - name: Test
        run: pnpm exec projen test
